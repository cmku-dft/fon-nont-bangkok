<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ฝนนนท์–บางกอก</title>
<meta name="description" content="พยากรณ์ฝนรายชั่วโมงสำหรับนนทบุรีและกรุงเทพฯ · Hourly rain forecast for Nonthaburi and Bangkok">
<meta name="theme-color" content="#EEF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1312" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --paper:#EEF2F1; --surface:#FFFFFF; --surface2:#E5EBEA;
    --ink:#16211F; --ink2:#42554F; --muted:#6E817E; --line:#D2DBD9;
    --rain:#1B6E8C; --rainsoft:#A8CCD9; --storm:#0F3A49;
    --heat:#B85226; --good:#44785A; --warn:#9C6C15;
    --shadow:0 1px 2px rgba(18,40,45,.07), 0 6px 18px -10px rgba(18,40,45,.25);
    --display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
    --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#0B1312; --surface:#141F1E; --surface2:#1C2B29;
      --ink:#E7EEEC; --ink2:#AFC0BC; --muted:#7E918D; --line:#243634;
      --rain:#63B8D4; --rainsoft:#2B5061; --storm:#94D6EA;
      --heat:#E4865A; --good:#7CBC90; --warn:#D3A54A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0B1312; --surface:#141F1E; --surface2:#1C2B29;
    --ink:#E7EEEC; --ink2:#AFC0BC; --muted:#7E918D; --line:#243634;
    --rain:#63B8D4; --rainsoft:#2B5061; --storm:#94D6EA;
    --heat:#E4865A; --good:#7CBC90; --warn:#D3A54A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }

  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  .wrap{max-width:740px; margin:0 auto; padding-inline:16px; padding-block:22px 40px;
        display:flex; flex-direction:column; gap:18px;}
  h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; line-height:1.25;}
  p{margin:0}

  /* masthead */
  .masthead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .masthead h1{font-size:26px; font-weight:700; letter-spacing:-.01em;}
  .mh-right{display:flex; align-items:center; gap:10px;}
  .stamp{font-size:12px; color:var(--muted); font-family:var(--mono);}
  .langsw{display:inline-flex; border:1px solid var(--line); border-radius:999px;
          overflow:hidden; background:var(--surface);}
  .langsw button{font-family:var(--body); font-size:12px; font-weight:600; letter-spacing:.02em;
          border:0; background:transparent; color:var(--muted); padding:5px 11px; cursor:pointer;
          transition:background .15s, color .15s;}
  .langsw button[aria-pressed="true"]{background:var(--storm); color:var(--paper);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .langsw button[aria-pressed="true"]{color:#08201C}}
  :root[data-theme="dark"] .langsw button[aria-pressed="true"]{color:#08201C}

  /* place chips */
  .places{display:flex; gap:7px; overflow-x:auto; padding-bottom:3px; margin-inline:-2px; padding-inline:2px;}
  .places::-webkit-scrollbar{height:0}
  .chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--ink2);
        font-family:var(--body); font-size:13.5px; font-weight:500; padding:7px 13px; border-radius:999px;
        cursor:pointer; white-space:nowrap; transition:background .15s, color .15s, border-color .15s;}
  .chip:hover{border-color:var(--rain)}
  .chip[aria-pressed="true"]{background:var(--storm); border-color:var(--storm); color:var(--paper);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08201C}}
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08201C}
  .chip:focus-visible,button:focus-visible{outline:2px solid var(--rain); outline-offset:2px}
  .chip.locate{border-color:var(--rain); color:var(--rain)}
  .chip.locate[aria-pressed="true"]{color:var(--paper)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.locate[aria-pressed="true"]{color:#08201C}}
  :root[data-theme="dark"] .chip.locate[aria-pressed="true"]{color:#08201C}
  .chip.mini{padding:7px 10px; font-size:14px; line-height:1; color:var(--muted); margin-inline-start:-4px}
  .chip[disabled]{opacity:.55; cursor:default}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);}

  .hero{padding:18px 18px 16px; display:flex; flex-direction:column; gap:16px;}
  .verdict{font-family:var(--display); font-size:20px; font-weight:600; letter-spacing:-.005em;}
  .verdict em{font-style:normal; color:var(--rain);}
  .nowrow{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap;}
  .feels{display:flex; align-items:baseline; gap:6px;}
  .feels .big{font-family:var(--display); font-size:50px; font-weight:600; line-height:.9; color:var(--heat); letter-spacing:-.02em;}
  .feels .unit{font-family:var(--display); font-size:20px; font-weight:500; color:var(--heat);}
  .feels-lab{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:5px;}
  .actual{display:flex; flex-direction:column; gap:1px; padding-bottom:3px;}
  .actual .t{font-family:var(--mono); font-size:16px; color:var(--ink);}
  .actual .c{font-size:13.5px; color:var(--ink2);}

  .sect{padding:16px 18px 18px;}
  .sect-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .sect-head h2{font-size:14px; font-weight:600; letter-spacing:.02em;}
  .sect-head .hint{font-size:11.5px; color:var(--muted); text-align:right;}
  .tl{display:flex; gap:2px; align-items:flex-end; height:104px;}
  .tl .col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:flex-end;
           height:100%; position:relative;}
  .tl .bar{width:100%; border-radius:2px 2px 0 0; background:var(--rainsoft); min-height:2px;}
  .tl .col[data-wet="1"] .bar{background:var(--rain)}
  .tl .col[data-wet="2"] .bar{background:var(--storm)}
  .tl .col[data-now="1"]::after{content:""; position:absolute; inset:-4px -1px -4px -1px;
        border:1.5px solid var(--heat); border-radius:4px; pointer-events:none;}
  .axis{display:flex; gap:2px; margin-top:7px;}
  .axis .t{flex:1 1 0; min-width:0; font-family:var(--mono); font-size:10px; color:var(--muted);
           text-align:center; white-space:nowrap;}
  .axis .t.day{color:var(--ink2); font-weight:500;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11.5px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .sw{width:9px; height:9px; border-radius:2px; display:inline-block;}

  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{padding:12px 13px 13px; display:flex; flex-direction:column; gap:3px;}
  .tile .k{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);}
  .tile .v{font-family:var(--mono); font-size:21px; color:var(--ink); line-height:1.15;}
  .tile .v small{font-size:11px; color:var(--muted); margin-inline-start:2px;}
  .tile .n{font-size:12px; color:var(--ink2);}
  .tile .n.good{color:var(--good)} .tile .n.warn{color:var(--warn)} .tile .n.hot{color:var(--heat)}

  .week{display:flex; flex-direction:column;}
  .row{display:grid; grid-template-columns:56px 1fr 74px 58px; align-items:center; gap:10px;
       padding:10px 18px; border-top:1px solid var(--line);}
  .row:first-child{border-top:none}
  .row .d{display:flex; flex-direction:column; line-height:1.2;}
  .row .d b{font-family:var(--display); font-size:14px; font-weight:600;}
  .row .d s{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-decoration:none;}
  .row .cond{font-size:13px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .rain{font-family:var(--mono); font-size:12px; color:var(--rain); text-align:right;}
  .row .rain i{font-style:normal; color:var(--muted); font-size:10.5px;}
  .row .temps{display:flex; flex-direction:column; gap:3px;}
  .trange{height:5px; border-radius:3px; background:var(--surface2); position:relative; overflow:hidden;}
  .trange i{position:absolute; top:0; bottom:0; border-radius:3px;
            background:linear-gradient(90deg,var(--rain),var(--heat));}
  .tnum{font-family:var(--mono); font-size:11px; color:var(--ink2); display:flex; justify-content:space-between;}
  @media (max-width:430px){
    .row{grid-template-columns:50px 1fr 62px}
    .row .cond{display:none}
  }

  .note{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .note b{color:var(--ink2); font-weight:600;}
  .msg{padding:12px 15px; border-radius:11px; background:var(--surface2);
       border:1px solid var(--line); font-size:13.5px; color:var(--ink2);
       display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .msg button{font-family:var(--body); font-size:13px; font-weight:500; border:1px solid var(--line);
       background:var(--surface); color:var(--ink); border-radius:8px; padding:5px 12px; cursor:pointer;}
  .skel{opacity:.4}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1 id="title">ฝนนนท์–บางกอก</h1>
    <div class="mh-right">
      <span class="stamp" id="stamp"></span>
      <div class="langsw" id="langsw" role="group" aria-label="Language">
        <button type="button" data-lang="th">ไทย</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div class="places" id="places" role="group"></div>

  <div id="msg" hidden></div>

  <div id="app" class="skel">
    <div style="display:flex;flex-direction:column;gap:18px">
      <section class="card hero">
        <p class="verdict" id="verdict"></p>
        <div class="nowrow">
          <div>
            <span class="feels-lab" data-i18n="feelsLike"></span>
            <span class="feels"><span class="big" id="feels">–</span><span class="unit">°</span></span>
          </div>
          <div class="actual">
            <span class="t" id="actual">–</span>
            <span class="c" id="cond">–</span>
          </div>
        </div>
      </section>

      <section class="card sect">
        <div class="sect-head">
          <h2 data-i18n="next30"></h2>
          <span class="hint" data-i18n="tlHint"></span>
        </div>
        <div class="tl" id="tl"></div>
        <div class="axis" id="axis"></div>
        <div class="legend">
          <span><i class="sw" style="background:var(--rainsoft)"></i><span data-i18n="legDry"></span></span>
          <span><i class="sw" style="background:var(--rain)"></i><span data-i18n="legLight"></span></span>
          <span><i class="sw" style="background:var(--storm)"></i><span data-i18n="legHeavy"></span></span>
          <span><i class="sw" style="border:1.5px solid var(--heat);background:transparent"></i><span data-i18n="legNow"></span></span>
        </div>
      </section>

      <div class="tiles">
        <div class="card tile"><span class="k">PM2.5</span><span class="v" id="pm">–</span><span class="n" id="pmNote">–</span></div>
        <div class="card tile"><span class="k" data-i18n="uvToday"></span><span class="v" id="uv">–</span><span class="n" id="uvNote">–</span></div>
        <div class="card tile"><span class="k" data-i18n="humidity"></span><span class="v" id="rh">–</span><span class="n" id="rhNote">–</span></div>
        <div class="card tile"><span class="k" data-i18n="rainToday"></span><span class="v" id="sum">–</span><span class="n" id="sumNote">–</span></div>
      </div>

      <section class="card">
        <div class="sect-head" style="padding:16px 18px 0; margin-bottom:10px;">
          <h2 data-i18n="next7"></h2>
          <span class="hint" data-i18n="weekHint"></span>
        </div>
        <div class="week" id="week"></div>
      </section>
    </div>
  </div>

  <p class="note" id="foot"></p>
</div>

<script>
"use strict";

/* =====================================================================
   ข้อความสองภาษา · Bilingual strings
   เพิ่มภาษาใหม่ได้โดยเติมคีย์อีกชุดใน I18N แล้วเพิ่มปุ่มใน .langsw
   ===================================================================== */
const I18N = {
  th: {
    title: "ฝนนนท์–บางกอก",
    loading: "กำลังโหลด…",
    locating: "กำลังหาตำแหน่ง…",
    updated: t => "อัปเดต " + t + " น.",
    retry: "ลองใหม่",
    feelsLike: "รู้สึกเหมือน",
    actual: (t, w) => `${t}°C · ลม ${w} กม./ชม.`,
    next30: "ฝน 30 ชั่วโมงข้างหน้า",
    tlHint: "แท่ง = โอกาสตก · สี = ความแรง",
    legDry: "ไม่ตก/ละออง", legLight: "ฝนปรอย", legHeavy: "ฝนหนัก 1 มม.+", legNow: "ชั่วโมงนี้",
    uvToday: "UV วันนี้", humidity: "ความชื้น", rainToday: "ฝนสะสมวันนี้",
    next7: "7 วันข้างหน้า", weekHint: "ต่ำสุด–สูงสุด · ฝนสะสม",
    today: "วันนี้",
    days: ["อา","จ","อ","พ","พฤ","ศ","ส"],
    mm: "มม.",
    useLocation: "ใช้ตำแหน่งปัจจุบัน",
    myLocation: "ตำแหน่งปัจจุบัน",
    searching: "กำลังหา…",
    updateLocation: "อัปเดตตำแหน่ง",
    pmNotes: ["ดีมาก","ปานกลาง","เริ่มมีผลต่อสุขภาพ","ควรใส่หน้ากาก"],
    uvNotes: ["ต่ำ","ปานกลาง","สูง — ทาครีมกันแดด","สูงมาก","อันตราย"],
    rhNote: d => `ต่างจากอุณหภูมิจริง +${d}°`,
    sumNotes: ["ไม่มีปัญหา","ถนนเปียก รถอาจติด","เสี่ยงน้ำขังจุดต่ำ","เสี่ยงน้ำท่วมขัง"],
    noAir: "ไม่มีข้อมูลฝุ่นตอนนี้",
    vRainAllDay: h => `ฝนโปรยยาวทั้งวัน — หนักสุดราว <em>${h} น.</em>`,
    vRainNow: (end, peak) => `ฝนตกอยู่ตอนนี้ น่าจะซาราว <em>${end} น.</em> · หนักสุดช่วง ${peak}`,
    vDryNow: (h, gap) => `ตอนนี้แห้ง · ฝนน่าจะกลับมา <em>${h} น.</em> (${gap})`,
    gapSoon: "อีกไม่ถึงชั่วโมง",
    gapHours: n => `อีกราว ${n} ชม.`,
    vNoRain: "ช่วง 12 ชั่วโมงนี้ไม่มีสัญญาณฝนชัด — <em>ไม่ต้องพกร่มก็ได้</em>",
    vNoData: "ข้อมูลรายชั่วโมงหมดช่วงแล้ว — ดูสรุป 7 วันด้านล่างแทน",
    errStale: "ดึงข้อมูลใหม่ไม่สำเร็จ กำลังแสดงข้อมูลรอบก่อน",
    errFirst: m => `ตอนนี้ดึงพยากรณ์ไม่ได้ (${m})`,
    errNoPlaces: "ไม่มีข้อมูลพื้นที่",
    errPartial: "ข้อมูลพยากรณ์ที่ได้กลับมาไม่ครบ",
    geoDenied: "ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ให้เว็บนี้ในการตั้งค่าเบราว์เซอร์แล้วลองใหม่",
    geoTimeout: "หาตำแหน่งนานเกินไป ลองใหม่อีกครั้ง หรือออกไปที่โล่งกว่านี้",
    geoOther: "หาตำแหน่งไม่ได้ในตอนนี้ ลองใหม่อีกครั้ง",
    geoNoAnswer: "ยังไม่ได้คำตอบเรื่องสิทธิ์ตำแหน่ง — ถ้ามีกล่องขออนุญาตขึ้นมา ให้กดอนุญาตแล้วลองใหม่",
    foot: (src, la, lo) =>
      `ข้อมูลจาก <b>${src}</b> · ตำแหน่งกริดที่ใช้จริง ${la}, ${lo} (ความละเอียดราว 11 กม. ต่อช่อง) · หน้านี้ดึงข้อมูลใหม่ทุก 10 นาที`,
    footGeo: " · <b>พิกัดของคุณเก็บอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น</b> ใช้เพื่อถามพยากรณ์จาก Open-Meteo และไม่ได้ส่งไปที่อื่น",
    tip: (h, pop, mm, d) => `${h}:00 · โอกาสฝน ${pop}% · ${mm} มม. · ${d}`,
    midnight: "เที่ยงคืน",
    wmo: {0:"ท้องฟ้าแจ่มใส",1:"มีเมฆบางส่วน",2:"มีเมฆเป็นส่วนมาก",3:"เมฆมาก",45:"หมอก",48:"หมอกน้ำค้างแข็ง",
      51:"ฝนละอองเบา",53:"ฝนละออง",55:"ฝนละอองหนัก",56:"ฝนละอองเย็นจัด",57:"ฝนละอองเย็นจัดหนัก",
      61:"ฝนเล็กน้อย",63:"ฝนปานกลาง",65:"ฝนหนัก",66:"ฝนเย็นจัด",67:"ฝนเย็นจัดหนัก",
      80:"ฝนซู่",81:"ฝนซู่ปานกลาง",82:"ฝนซู่หนักมาก",95:"ฝนฟ้าคะนอง",96:"ฝนฟ้าคะนองมีลูกเห็บ",99:"พายุฝนฟ้าคะนอง"},
  },
  en: {
    title: "Nonthaburi–Bangkok Rain",
    loading: "Loading…",
    locating: "Finding you…",
    updated: t => "Updated " + t,
    retry: "Retry",
    feelsLike: "Feels like",
    actual: (t, w) => `${t}°C · wind ${w} km/h`,
    next30: "Rain, next 30 hours",
    tlHint: "Bar = chance · colour = intensity",
    legDry: "Dry or drizzle", legLight: "Light rain", legHeavy: "Heavy, 1 mm+", legNow: "This hour",
    uvToday: "UV today", humidity: "Humidity", rainToday: "Rain today",
    next7: "Next 7 days", weekHint: "Low–high · total rain",
    today: "Today",
    days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    mm: "mm",
    useLocation: "Use my location",
    myLocation: "My location",
    searching: "Finding…",
    updateLocation: "Update location",
    pmNotes: ["Very good","Moderate","Unhealthy for some","Wear a mask"],
    uvNotes: ["Low","Moderate","High — use sunscreen","Very high","Extreme"],
    rhNote: d => `+${d}° above the actual reading`,
    sumNotes: ["Nothing to worry about","Wet roads, slower traffic","Puddles in low spots","Flooding likely"],
    noAir: "No air data right now",
    vRainAllDay: h => `Rain on and off all day — heaviest near <em>${h}</em>`,
    vRainNow: (end, peak) => `Raining now · easing around <em>${end}</em> · heaviest at ${peak}`,
    vDryNow: (h, gap) => `Dry for now · rain returns around <em>${h}</em> (${gap})`,
    gapSoon: "within the hour",
    gapHours: n => `in about ${n} h`,
    vNoRain: "No clear rain signal for the next 12 hours — <em>leave the umbrella</em>",
    vNoData: "Hourly data has run out — see the 7-day summary below",
    errStale: "Could not refresh — showing the previous reading",
    errFirst: m => `Can't reach the forecast right now (${m})`,
    errNoPlaces: "No locations came back",
    errPartial: "The forecast came back incomplete",
    geoDenied: "Location permission was refused — allow this site in your browser settings, then try again",
    geoTimeout: "Took too long to find you. Try again, or move somewhere more open",
    geoOther: "Could not find your location right now. Try again",
    geoNoAnswer: "No answer to the location prompt yet — if you see it, tap Allow and try again",
    foot: (src, la, lo) =>
      `Data from <b>${src}</b> · grid cell in use ${la}, ${lo} (about 11 km per cell) · this page refreshes every 10 minutes`,
    footGeo: " · <b>Your coordinates stay in this browser.</b> They are used to query Open-Meteo and are sent nowhere else",
    tip: (h, pop, mm, d) => `${h}:00 · ${pop}% chance · ${mm} mm · ${d}`,
    midnight: "midnight",
    wmo: {0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",
      51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Heavy freezing drizzle",
      61:"Light rain",63:"Moderate rain",65:"Heavy rain",66:"Freezing rain",67:"Heavy freezing rain",
      80:"Rain showers",81:"Moderate showers",82:"Violent showers",95:"Thunderstorm",
      96:"Thunderstorm with hail",99:"Severe thunderstorm"},
  },
};

const $ = id => document.getElementById(id);
function lsGet(k){ try { return localStorage.getItem("fnb:"+k); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem("fnb:"+k, v); } catch {} }

/* ภาษาเริ่มต้น: ที่เคยเลือกไว้ ไม่งั้นดูจากภาษาเครื่อง */
let lang = (() => {
  const saved = lsGet("lang");
  if (saved && I18N[saved]) return saved;
  return (navigator.language || "").toLowerCase().startsWith("th") ? "th" : "en";
})();
const T = () => I18N[lang];
const wmo = c => T().wmo[c] ?? "—";

/* =====================================================================
   พื้นที่ที่แสดง · Locations
   ทุกจุดมีชื่อสองภาษา · เพิ่มได้ตามใจ id ห้ามซ้ำ
   ===================================================================== */
const LOCS = [
  { id:"nont",       lat:13.8591,  lon:100.5217,
    th:{ name:"เมืองนนทบุรี",    near:"ปากเกร็ด · บางกรวย · ท่าน้ำนนท์" },
    en:{ name:"Nonthaburi",      near:"Pak Kret · Bang Kruai · Nonthaburi Pier" } },
  { id:"bangyai",    lat:13.8730,  lon:100.3860,
    th:{ name:"บางใหญ่",         near:"บางบัวทอง · ไทรน้อย · เซ็นทรัลเวสต์เกต" },
    en:{ name:"Bang Yai",        near:"Bang Bua Thong · Sai Noi · Westgate" } },
  { id:"bkk",        lat:13.7440,  lon:100.5340,
    th:{ name:"กรุงเทพฯ ชั้นใน", near:"ปทุมวัน · สาทร · บางรัก · พญาไท" },
    en:{ name:"Inner Bangkok",   near:"Pathum Wan · Sathon · Bang Rak · Phaya Thai" } },
  { id:"ladkrabang", lat:13.7220,  lon:100.7860,
    th:{ name:"ลาดกระบัง",       near:"สุวรรณภูมิ · มีนบุรี · ร่มเกล้า" },
    en:{ name:"Lat Krabang",     near:"Suvarnabhumi · Min Buri · Rom Klao" } },
  { id:"bangna",     lat:13.6680,  lon:100.6040,
    th:{ name:"บางนา",           near:"พระโขนง · สมุทรปราการ · แบริ่ง" },
    en:{ name:"Bang Na",         near:"Phra Khanong · Samut Prakan · Bearing" } },
  { id:"baan",       lat:13.86718, lon:100.53985,
    th:{ name:"บ้าน",            near:"ปากเกร็ด · บางกรวย · ท่าน้ำนนท์" },
    en:{ name:"Home",            near:"Pak Kret · Bang Kruai · Nonthaburi Pier" } },
];

/* ---------- ตำแหน่งปัจจุบันจากเครื่อง ---------- */
const GEO_OK = "geolocation" in navigator && window.isSecureContext;
let herePos = (() => {
  try {
    const p = JSON.parse(localStorage.getItem("fnb:here") || "null");
    return (p && Number.isFinite(p.lat) && Number.isFinite(p.lon)) ? p : null;
  } catch { return null; }
})();

const round3 = n => Math.round(n * 1000) / 1000;

function hereLoc(){
  if (!herePos) return null;
  const near = `${round3(herePos.lat)}, ${round3(herePos.lon)}`;
  return { id:"here", lat:herePos.lat, lon:herePos.lon,
           th:{ name:I18N.th.myLocation, near }, en:{ name:I18N.en.myLocation, near } };
}
const allLocs = () => { const h = hereLoc(); return h ? [h, ...LOCS] : LOCS.slice(); };

/* ลายนิ้วมือของรายการ ใช้ทิ้งแคชเก่าเมื่อ LOCS หรือตำแหน่งเปลี่ยน
   ปัด 3 ตำแหน่ง (~100 ม.) เพื่อไม่ให้ GPS ขยับนิดเดียวแล้วแคชพัง */
const locKey = () => allLocs().map(l => `${l.id}@${round3(l.lat)},${round3(l.lon)}`).join("|");

const WX_API = "https://api.open-meteo.com/v1/forecast";
const AQ_API = "https://air-quality-api.open-meteo.com/v1/air-quality";

/* ---------- เวลา ---------- */
const pad = n => String(n).padStart(2,"0");
/* Open-Meteo คืนเวลาไทยแบบไม่มี offset ต้องเติมเอง */
const parseBkk = s => new Date(s.length === 16 ? s + ":00+07:00" : s + "+07:00");
/* มุมมองเวลาไทย เพื่ออ่าน getHours/getDay ได้ถูกไม่ว่าเครื่องอยู่โซนไหน */
const inBkk = d => new Date(d.getTime() + (7*60 + d.getTimezoneOffset())*60000);

let DATA = null;
let activeId = lsGet("place") || null;
let locating = false;

/* ---------- เรียก API ---------- */
const asList = v => Array.isArray(v) ? v : [v];

async function getJson(url){
  const r = await fetch(url, { headers:{ accept:"application/json" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function fetchForecast(){
  const list = allLocs();
  const lat = list.map(l => l.lat).join(",");
  const lon = list.map(l => l.lon).join(",");

  const wxUrl = WX_API + "?" + new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m",
    hourly: "temperature_2m,precipitation_probability,precipitation,weather_code",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,uv_index_max",
    timezone: "Asia/Bangkok", forecast_days: "7", forecast_hours: "30",
  });
  const aqUrl = AQ_API + "?" + new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "pm10,pm2_5,us_aqi",
    timezone: "Asia/Bangkok", forecast_days: "1",
  });

  /* ค่าฝุ่นพังไม่ควรทำให้พยากรณ์ฝนพังตาม */
  const [wx, aq] = await Promise.all([ getJson(wxUrl), getJson(aqUrl).catch(() => null) ]);
  const wxList = asList(wx), aqList = aq ? asList(aq) : [];
  if (wxList.length < list.length || !wxList[0]?.hourly) throw new Error(T().errPartial);

  return {
    generatedAt: new Date().toISOString(),
    source: "Open-Meteo (ICON / GFS)",
    locations: list.map((loc, i) => {
      const w = wxList[i], a = aqList[i]?.current ?? null;
      return {
        id: loc.id, th: loc.th, en: loc.en,
        grid: { lat: w.latitude, lon: w.longitude },
        cur: { t:w.current.temperature_2m, rh:w.current.relative_humidity_2m,
               app:w.current.apparent_temperature, wc:w.current.weather_code,
               wind:w.current.wind_speed_10m },
        air: a ? { pm25:a.pm2_5, pm10:a.pm10, aqi:a.us_aqi } : null,
        hourly: { time:w.hourly.time, t:w.hourly.temperature_2m,
                  pop:w.hourly.precipitation_probability, mm:w.hourly.precipitation,
                  wc:w.hourly.weather_code },
        daily: { time:w.daily.time, wc:w.daily.weather_code,
                 mx:w.daily.temperature_2m_max, mn:w.daily.temperature_2m_min,
                 sum:w.daily.precipitation_sum, pop:w.daily.precipitation_probability_max,
                 uv:w.daily.uv_index_max },
      };
    }),
  };
}

/* แคชคำตอบ 10 นาที กันยิงซ้ำตอนรีโหลดรัวๆ (ภาษาไม่อยู่ในแคช สลับได้ฟรี) */
const CACHE_MS = 10 * 60 * 1000;
function cacheRead(){
  try {
    const box = JSON.parse(localStorage.getItem("fnb:wx") || "null");
    if (!box || box.key !== locKey()) return null;
    return (Date.now() - box.at < CACHE_MS) ? box.data : null;
  } catch { return null; }
}
function cacheWrite(data){
  try { localStorage.setItem("fnb:wx", JSON.stringify({ at: Date.now(), key: locKey(), data })); } catch {}
}

async function load({ silent = false, force = false } = {}) {
  if (!silent) $("stamp").textContent = T().loading;
  try {
    const cached = force ? null : cacheRead();
    DATA = cached ?? await fetchForecast();
    if (!cached) cacheWrite(DATA);
    if (!DATA.locations?.length) throw new Error(T().errNoPlaces);
    if (!DATA.locations.some(l => l.id === activeId)) activeId = DATA.locations[0].id;
    hideMsg();
    $("app").classList.remove("skel");
    renderPlaces();
    render();
  } catch (err) {
    showMsg(DATA ? T().errStale : T().errFirst(err.message));
  }
}

function showMsg(text){
  const m = $("msg");
  m.hidden = false; m.className = "msg"; m.textContent = "";
  const s = document.createElement("span"); s.textContent = text;
  const b = document.createElement("button"); b.type = "button"; b.textContent = T().retry;
  b.addEventListener("click", () => load({ force: true }));
  m.append(s, b);
}
function hideMsg(){ $("msg").hidden = true; }

/* ---------- ขอตำแหน่งจากเครื่อง ---------- */
const PIN = "\u{1F4CD}";

function geoMessage(err){
  if (err && err.code === 1) return T().geoDenied;
  if (err && err.code === 3) return T().geoTimeout;
  return T().geoOther;
}

function locate(){
  if (!GEO_OK || locating) return;
  locating = true;
  hideMsg();
  $("stamp").textContent = T().locating;
  renderPlaces();

  /* ถ้าผู้ใช้ปัดกล่องขออนุญาตทิ้งโดยไม่ตอบ เบราว์เซอร์จะไม่เรียก callback ใดเลย
     และ timeout ของ getCurrentPosition ไม่นับช่วงรอสิทธิ์ ต้องกันค้างเอง */
  let settled = false;
  const done = fn => (...args) => {
    if (settled) return;
    settled = true; clearTimeout(watchdog); locating = false;
    fn(...args);
  };
  const watchdog = setTimeout(() => {
    if (settled) return;
    settled = true; locating = false;
    $("stamp").textContent = "";
    showMsg(T().geoNoAnswer);
    renderPlaces();
    if (DATA) render();
  }, 15000);

  navigator.geolocation.getCurrentPosition(
    done(pos => {
      herePos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      try { localStorage.setItem("fnb:here", JSON.stringify(herePos)); } catch {}
      activeId = "here"; lsSet("place", "here");
      load({ force: true });
    }),
    done(err => {
      $("stamp").textContent = "";
      showMsg(geoMessage(err));
      renderPlaces();
      if (DATA) render();
    }),
    /* กริดกว้าง 11 กม. ความแม่นระดับเมตรไม่ช่วยอะไร แต่กิน GPS กับแบตเตอรี่ */
    { enableHighAccuracy: false, timeout: 12000, maximumAge: 5 * 60 * 1000 }
  );
}

/* ---------- ปุ่มเลือกพื้นที่ ---------- */
function renderPlaces(){
  const el = $("places");
  el.textContent = "";

  if (GEO_OK && !herePos) {
    const b = document.createElement("button");
    b.className = "chip locate"; b.type = "button";
    b.textContent = PIN + " " + (locating ? T().searching : T().useLocation);
    b.disabled = locating;
    b.addEventListener("click", locate);
    el.appendChild(b);
  }

  (DATA?.locations ?? []).forEach(L => {
    const b = document.createElement("button");
    b.className = "chip" + (L.id === "here" ? " locate" : "");
    b.type = "button";
    b.textContent = (L.id === "here" ? PIN + " " : "") + L[lang].name;
    b.setAttribute("aria-pressed", String(L.id === activeId));
    b.addEventListener("click", () => {
      activeId = L.id; lsSet("place", L.id);
      [...el.querySelectorAll(".chip")].forEach(c => c.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      render();
    });
    el.appendChild(b);

    if (L.id === "here") {
      const r = document.createElement("button");
      r.className = "chip mini"; r.type = "button";
      r.textContent = locating ? "…" : "↻";
      r.disabled = locating;
      r.title = T().updateLocation;
      r.setAttribute("aria-label", T().updateLocation);
      r.addEventListener("click", locate);
      el.appendChild(r);
    }
  });
}

/* ---------- ประโยคสรุป ---------- */
function verdictText(L, i){
  const H = L.hourly, n = H.time.length, S = T();
  const win = [];
  for (let k = i; k < Math.min(i + 14, n); k++)
    win.push({ k, pop: H.pop[k] ?? 0, mm: H.mm[k] ?? 0, t: inBkk(parseBkk(H.time[k])) });
  if (!win.length) return S.vNoData;

  const hm = d => pad(d.getHours()) + ":00";

  if (win[0].pop >= 60 || win[0].mm >= 0.3) {
    let k = 0;
    while (k < win.length && (win[k].pop >= 50 || win[k].mm >= 0.3)) k++;
    const peak = win.slice(0, Math.max(k,1)).reduce((a,b) => b.mm > a.mm ? b : a);
    if (k >= win.length) return S.vRainAllDay(hm(peak.t));
    return S.vRainNow(hm(win[k].t), hm(peak.t));
  }
  const next = win.find(w => w.pop >= 60);
  if (!next) return S.vNoRain;
  const gap = next.k - i;
  return S.vDryNow(hm(next.t), gap <= 1 ? S.gapSoon : S.gapHours(gap));
}

/* ---------- วาดหน้า ---------- */
function applyStatic(){
  const S = T();
  document.documentElement.lang = lang;
  document.title = S.title;
  $("title").textContent = S.title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = S[el.dataset.i18n];
    if (typeof v === "string") el.textContent = v;
  });
  [...$("langsw").children].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

function render(){
  if (!DATA) return;
  const S = T();
  const L = DATA.locations.find(x => x.id === activeId) ?? DATA.locations[0];
  const H = L.hourly, D = L.daily;

  const t0 = parseBkk(H.time[0]).getTime();
  let i = Math.floor((Date.now() - t0) / 3600000);
  i = Math.max(0, Math.min(i, H.time.length - 1));

  const clock = new Date(DATA.generatedAt).toLocaleTimeString("en-GB",
    { timeZone:"Asia/Bangkok", hour:"2-digit", minute:"2-digit" });
  $("stamp").textContent = S.updated(clock);

  const c = L.cur;
  $("verdict").innerHTML = verdictText(L, i);
  $("feels").textContent = c.app.toFixed(1);
  $("actual").textContent = S.actual(c.t.toFixed(1), Math.round(c.wind));
  $("cond").textContent = wmo(c.wc) + " · " + L[lang].near;

  /* แถบฝน */
  const tl = $("tl"), ax = $("axis");
  tl.textContent = ""; ax.textContent = "";
  for (let k = 0; k < H.time.length; k++) {
    const mm = H.mm[k] ?? 0, pop = H.pop[k] ?? 0;
    const col = document.createElement("div");
    col.className = "col";
    col.dataset.wet = mm >= 1 ? "2" : mm >= 0.3 ? "1" : "0";
    if (k === i) col.dataset.now = "1";
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = Math.max(2, pop) + "%";
    const t = inBkk(parseBkk(H.time[k]));
    col.title = S.tip(pad(t.getHours()), pop, mm, wmo(H.wc[k]));
    col.appendChild(bar); tl.appendChild(col);

    const lab = document.createElement("div");
    lab.className = "t";
    const hr = t.getHours();
    if (hr % 3 === 0) { lab.textContent = pad(hr); if (hr === 0) { lab.classList.add("day"); lab.title = S.midnight; } }
    ax.appendChild(lab);
  }

  /* การ์ดสี่ใบ */
  if (L.air) {
    const pm = L.air.pm25;
    const idx = pm < 15 ? 0 : pm < 25 ? 1 : pm < 37.5 ? 2 : 3;
    $("pm").innerHTML = pm.toFixed(1) + '<small>µg/m³</small>';
    const n = $("pmNote");
    n.textContent = S.pmNotes[idx];
    n.className = "n " + (idx === 0 ? "good" : idx < 3 ? "warn" : "hot");
  } else {
    $("pm").textContent = "–";
    $("pmNote").textContent = S.noAir; $("pmNote").className = "n";
  }

  const uv = D.uv[0] ?? 0;
  const ui = uv < 3 ? 0 : uv < 6 ? 1 : uv < 8 ? 2 : uv < 11 ? 3 : 4;
  $("uv").textContent = uv.toFixed(1);
  const uvN = $("uvNote");
  uvN.textContent = S.uvNotes[ui];
  uvN.className = "n " + (ui < 2 ? "good" : ui === 2 ? "warn" : "hot");

  $("rh").innerHTML = c.rh + '<small>%</small>';
  $("rhNote").textContent = S.rhNote((c.app - c.t).toFixed(1));
  $("rhNote").className = "n hot";

  const s = D.sum[0] ?? 0;
  const si = s < 10 ? 0 : s < 30 ? 1 : s < 60 ? 2 : 3;
  $("sum").innerHTML = s.toFixed(1) + `<small>${S.mm}</small>`;
  const sN = $("sumNote");
  sN.textContent = S.sumNotes[si];
  sN.className = "n " + (si === 0 ? "good" : si === 1 ? "warn" : "hot");

  /* 7 วัน */
  const wk = $("week"); wk.textContent = "";
  const lo = Math.min(...D.mn), hi = Math.max(...D.mx), span = (hi - lo) || 1;
  D.time.forEach((iso, k) => {
    const day = inBkk(parseBkk(iso + "T00:00"));
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      `<div class="d"><b>${k === 0 ? S.today : S.days[day.getDay()]}</b><s>${day.getDate()}/${day.getMonth()+1}</s></div>` +
      `<div class="cond">${wmo(D.wc[k])}</div>` +
      `<div class="temps"><div class="trange"><i style="left:${(D.mn[k]-lo)/span*100}%;right:${(hi-D.mx[k])/span*100}%"></i></div>` +
        `<div class="tnum"><span>${Math.round(D.mn[k])}°</span><span>${Math.round(D.mx[k])}°</span></div></div>` +
      `<div class="rain">${(D.sum[k] ?? 0).toFixed(1)}<i> ${S.mm}</i><br><i>${D.pop[k] ?? 0}%</i></div>`;
    wk.appendChild(row);
  });

  $("foot").innerHTML = S.foot(DATA.source, L.grid.lat.toFixed(3), L.grid.lon.toFixed(3))
                      + (L.id === "here" ? S.footGeo : "");
}

/* ---------- ปุ่มสลับภาษา ---------- */
$("langsw").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  lsSet("lang", lang);
  applyStatic();
  renderPlaces();
  if (DATA) render(); else $("stamp").textContent = T().loading;
});

/* ---------- เริ่มทำงาน ---------- */
applyStatic();
renderPlaces();
load();
setInterval(() => load({ silent: true, force: true }), CACHE_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") load({ silent: true });
});
</script>
</body>
</html>
